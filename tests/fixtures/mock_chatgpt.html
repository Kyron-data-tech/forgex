<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatGPT Mock Interface</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #212121; color: #ececec; margin: 0; padding: 20px; }
        .chat-container { max-width: 768px; margin: 0 auto; display: flex; flex-direction: column; height: 90vh; }
        .messages { flex: 1; overflow-y: auto; padding: 20px 0; }
        .message { margin-bottom: 24px; line-height: 1.6; }
        .user-turn { color: #ececec; background: #2f2f2f; padding: 14px 18px; border-radius: 18px; max-width: 80%; align-self: flex-end; }
        .agent-turn { color: #d1d5db; }
        pre { background: #000; padding: 16px; border-radius: 8px; overflow-x: auto; color: #10b981; }
        .composer-area { position: relative; background: #2f2f2f; border-radius: 24px; padding: 12px 16px; display: flex; align-items: flex-end; }
        #prompt-textarea { flex: 1; min-height: 24px; max-height: 200px; outline: none; color: white; overflow-y: auto; white-space: pre-wrap; font-size: 16px; }
        #prompt-textarea:empty:before { content: "Message ChatGPT..."; color: #8e8e8e; }
        button[data-testid="send-button"] { background: white; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
        button[data-testid="stop-button"] { background: white; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: none; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="messages" id="messages-list">
            <div class="message agent-turn" data-message-author-role="assistant">
                How can I help you today?
            </div>
        </div>

        <div class="composer-area">
            <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
            <button type="button" data-testid="send-button" aria-label="Send prompt">➔</button>
            <button type="button" data-testid="stop-button" aria-label="Stop streaming">■</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('prompt-textarea');
        const sendBtn = document.querySelector('button[data-testid="send-button"]');
        const stopBtn = document.querySelector('button[data-testid="stop-button"]');
        const messagesList = document.getElementById('messages-list');

        function triggerResponse(userText) {
            // Append user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-turn';
            userMsg.textContent = userText;
            messagesList.appendChild(userMsg);
            textarea.innerHTML = '';

            // Toggle stop button
            sendBtn.style.display = 'none';
            stopBtn.style.display = 'flex';

            setTimeout(() => {
                stopBtn.style.display = 'none';
                sendBtn.style.display = 'flex';

                const assistMsg = document.createElement('div');
                assistMsg.className = 'message agent-turn';
                assistMsg.setAttribute('data-message-author-role', 'assistant');

                const sampleJson = {
                    "name": "Marie Curie",
                    "category": "scientists",
                    "tagline": "Pioneering physicist and chemist who discovered radioactivity.",
                    "country": "Poland",
                    "birth": "1867",
                    "death": "1934",
                    "summary": "Marie Curie was the first woman to win a Nobel Prize and the only woman to win Nobel Prizes in two different scientific fields. Her discovery of radium and polonium transformed our understanding of nuclear physics and medicine.",
                    "story": "Marie Curie was born Maria Sklodowska in Warsaw in 1867. She studied at the Sorbonne in Paris, where she met her husband Pierre Curie.\n\nTogether, they isolated radium and polonium under challenging laboratory conditions. During World War I, she pioneered mobile X-ray units.\n\nHer enduring legacy inspires scientists around the globe.",
                    "source_url": "https://www.nobelprize.org/prizes/physics/1903/marie-curie/biographical/"
                };

                assistMsg.innerHTML = `<p>Here is the structured biographical data extracted from the research:</p><pre><code>` + JSON.stringify(sampleJson, null, 2) + `</code></pre>`;
                messagesList.appendChild(assistMsg);
            }, 800);
        }

        sendBtn.addEventListener('click', () => {
            const text = textarea.innerText.trim();
            if (text) triggerResponse(text);
        });

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = textarea.innerText.trim();
                if (text) triggerResponse(text);
            }
        });
    </script>
</body>
</html>
